[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "greet-docs"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
greet-docs = "greet_docs:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["sphinx==9.0.4"]
